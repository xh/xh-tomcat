name: Check Tomcat

# Daily check for updates to the Tomcat versions pinned in tomcat-versions.json. Opens a PR to
# develop for newer patches on the pinned lines, or for upstream base image rebuilds (JDK and
# Ubuntu updates) that our latest-* images don't have yet. Opens an issue for a newer Tomcat line
# or LTS JDK, and if develop has been idle long enough that GitHub may disable scheduled
# workflows. See .github/scripts/check-tomcat.sh for details.
#
# Then posts to the repo's Slack channel (the SLACK_WEBHOOK_URL secret) when a PR or bot issue has
# waited 3+ days, and on any failed run. See .github/scripts/slack-report.sh.
#
# Branches, PRs and issues all come from the org's XH Build Bot GitHub App. Its credentials are
# the org-level XH_BUILD_BOT_CLIENT_ID variable and XH_BUILD_BOT_PRIVATE_KEY secret.

on:
  schedule:
    # 13:23 UTC daily. Off the top of the hour, when GitHub notes scheduled runs can be delayed.
    - cron: '23 13 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run. Log what would happen, and check the bot can push, without changing anything.'
        type: boolean
        default: false
      pinned-override:
        description: 'Test only. Treat these versions as pinned (e.g. "tc10=10.1.60 tc11=11.0.27"). Use with dry run.'
        type: string
        default: ''
      compare-release:
        description: 'Test only. Compare upstream base images against this release (e.g. "4.2.0") instead of latest-*. Use with dry run.'
        type: string
        default: ''
      slack-report:
        description: 'Test only. Post the Slack report now, even if nothing has waited 3+ days. With dry run, print it instead.'
        type: boolean
        default: false

# The workflow's own token is unused. The bot token covers everything.
permissions: {}

concurrency:
  group: checkTomcat
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint XH Build Bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.XH_BUILD_BOT_CLIENT_ID }}
          private-key: ${{ secrets.XH_BUILD_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: actions/checkout@v7
        with:
          ref: develop
          # Push the bump branch as the bot.
          token: ${{ steps.bot-token.outputs.token }}

      # Read-only use, so image inspection avoids the anonymous pull rate limit. Hub API calls stay
      # anonymous, and fail the run if limited.
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check for Tomcat updates
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          PINNED_OVERRIDE: ${{ inputs.pinned-override }}
          COMPARE_RELEASE: ${{ inputs.compare-release || 'latest' }}
        run: .github/scripts/check-tomcat.sh

      - name: Report to Slack
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DRY_RUN: ${{ inputs.dry-run && '1' || '0' }}
          FORCE_REPORT: ${{ inputs.slack-report && '1' || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/slack-report.sh

  # Posts to Slack when this workflow fails, so a broken run is noticed. Needs no checkout, so
  # it still works when the failure is early.
  alert:
    needs: [check]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Alert Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ":rotating_light: xh-tomcat: ${{ github.workflow }} failed"
          BODY: "The `${{ github.workflow }}` workflow failed. Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>."
          FOOTER: "Posted on every failed run of this workflow."
        run: |
          jq -n --arg title "$TITLE" --arg body "$BODY" --arg footer "$FOOTER" '{text: $title, blocks: [
              {type: "header", text: {type: "plain_text", text: $title, emoji: true}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
            ]}' | curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
