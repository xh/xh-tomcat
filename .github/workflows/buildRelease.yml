name: Build Release

# Publishes a numbered xhio/xh-tomcat release. Manually triggered from master
# (or a hotfix branch). Validates the release version, builds the release
# variants in parallel against the pinned Tomcat patch versions in
# tomcat-versions.json, pushes to Docker Hub with both the immutable
# <xh-release>-<line>-jdkXX tag and the floating latest-<line>-jdkXX tag,
# then tags the commit and creates a GitHub release.
#
# To release with a newer Tomcat patch: bump the version in
# tomcat-versions.json, update CHANGELOG.md and the README table, merge to
# master, then dispatch this workflow. The Check Tomcat workflow opens a PR
# with these changes when upstream publishes a new patch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 3.3.0)'
        required: true
        type: string
      is-hotfix:
        description: 'As hotfix. Check when releasing a hotfix to a version other than the latest.'
        required: true
        default: false
        type: boolean

# Run release builds one-by-one, but never cancel a release in flight.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  validate:
    # Guards against accidental release from develop. Requires master for standard
    # releases and a branch other than master (or develop) when is-hotfix is set.
    if: github.ref != 'refs/heads/develop' && ((github.ref == 'refs/heads/master') != inputs.is-hotfix)

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
      - name: Validate release version
        uses: xh/hoist-dev-utils/.github/actions/validate-release-version@master
        with:
          version: ${{ inputs.version }}
          is-hotfix: ${{ inputs.is-hotfix }}

  # Reads the pinned Tomcat patch versions and JDKs from tomcat-versions.json.
  matrix:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          INCLUDE=$(jq -c '[.[] | {line, version, jdk: .jdks[]}]' tomcat-versions.json)
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: build (${{ matrix.version }}, ${{ matrix.line }}, ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A buildx builder (docker-container driver) is required to attach attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, test and push image
        env:
          VERSION_TAG: xhio/xh-tomcat:${{ inputs.version }}-${{ matrix.line }}-${{ matrix.jdk }}
          LATEST_TAG: xhio/xh-tomcat:latest-${{ matrix.line }}-${{ matrix.jdk }}
        run: |
          .github/scripts/build-image.sh "${{ matrix.version }}" "${{ matrix.jdk }}" "${{ matrix.line }}" \
            "$VERSION_TAG" "$LATEST_TAG"

  release:
    needs: build

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout is required to be called with `fetch-depth: 0` and `fetch-tags: true`.
      - name: Create tag and GitHub release
        uses: xh/hoist-dev-utils/.github/actions/create-tag-and-github-release@master
        with:
          version: ${{ inputs.version }}
          is-hotfix: ${{ inputs.is-hotfix }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
