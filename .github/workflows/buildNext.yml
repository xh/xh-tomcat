name: Build Next

# Publishes the `next-*` xhio/xh-tomcat snapshot tags. Rebuilt on every push
# to develop and weekly so they pick up upstream base image patches. The
# Tomcat lines and JDKs come from tomcat-versions.json.

on:
  push:
    branches: [develop]
  schedule:
    # 01:00 UTC Thursday ≈ Wed 20:00 EST / 21:00 EDT.
    # Approximates the prior TeamCity "Wednesday 20:00 America/New_York" trigger
    # (GitHub Actions cron is UTC-only with no DST awareness).
    - cron: '0 1 * * 4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Reads the Tomcat lines and JDKs from tomcat-versions.json. Each line builds on its floating
  # major.minor base tag (e.g. `tomcat:10.1-jdk17`), so runs pick up the latest upstream patch.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.read.outputs.include }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          INCLUDE=$(jq -c '[.[] | {line, version: (.version | split(".")[0:2] | join(".")), jdk: .jdks[]}]' tomcat-versions.json)
          echo "include=$INCLUDE" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    name: build (${{ matrix.line }}, ${{ matrix.jdk }})
    runs-on: ubuntu-latest
    concurrency:
      group: buildNext-${{ matrix.line }}-${{ matrix.jdk }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A buildx builder (docker-container driver) is required to attach attestations.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build, test and push image
        run: |
          .github/scripts/build-image.sh "${{ matrix.version }}" "${{ matrix.jdk }}" "${{ matrix.line }}" \
            "xhio/xh-tomcat:next-${{ matrix.line }}-${{ matrix.jdk }}"

  # Posts to Slack when this workflow fails, so a broken run is noticed. Needs no checkout, so
  # it still works when the failure is early.
  alert:
    needs: [matrix, build]
    if: failure()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Alert Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TITLE: ":rotating_light: xh-tomcat: ${{ github.workflow }} failed"
          BODY: "The `${{ github.workflow }}` workflow failed. Trigger: `${{ github.event_name }}` on `${{ github.ref_name }}`. <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>."
          FOOTER: "Posted on every failed run of this workflow."
        run: |
          jq -n --arg title "$TITLE" --arg body "$BODY" --arg footer "$FOOTER" '{text: $title, blocks: [
              {type: "header", text: {type: "plain_text", text: $title, emoji: true}},
              {type: "section", text: {type: "mrkdwn", text: $body}},
              {type: "context", elements: [{type: "mrkdwn", text: $footer}]}
            ]}' | curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
